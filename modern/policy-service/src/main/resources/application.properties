spring.application.name=policy-service
# No spring.datasource.url: Spring Boot starts an embedded H2 with a unique name per application context.
spring.sql.init.mode=embedded
# schema.sql holds the shared POLICY table; each policy type adds its own schema-<type>.sql.
spring.sql.init.schema-locations=classpath:schema.sql,optional:classpath*:schema-*.sql
genapp.seed.enabled=true
genapp.seed.location=classpath:seed/ksdspoly.txt
genapp.seed.db2cre-location=classpath:seed/db2cre.jcl
